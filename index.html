            document.getElementById('global-loader').classList.remove('hidden');

            setTimeout(() => {

            document.getElementById('footer-school-name').textContent = db.systemSettings.schoolName;

            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLoginPage();
            } else if (currentUser.role === 'admin') {
                app.innerHTML = renderAdminLayout();
                initMenuContent();
            } else if (currentUser.role === 'student') {
                app.innerHTML = renderStudentLayout();
                initStudentMenuContent();
            }

           ========================================================================== */

        function handleLogin(e) {
            e.preventDefault();
            showLoader();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();

            setTimeout(() => {
                const found = db.users.find(x => x.username === u && x.password === p);
                hideLoader();
                if (found) {
                    currentUser = found;
                    currentMenu = 'dashboard';
                    Swal.fire({
                        icon: 'success',
                        title: 'เข้าสู่ระบบสำเร็จ',
                        text: `ยินดีต้อนรับคุณ ${found.name}`,
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => renderApp());
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'เข้าสู่ระบบไม่สำเร็จ',
                        text: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
                        confirmButtonColor: '#0C7C82'
                    });
                }
            }, 500);
        }

        function logout() {
            Swal.fire({
                title: 'ยืนยันการออกจากระบบ?',
                text: 'คุณต้องการออกจากระบบตรวจการส่งงานใช่หรือไม่',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#0C7C82',
                cancelButtonColor: '#EF5350',
                confirmButtonText: 'ใช่, ออกจากระบบ',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    showLoader();
                    setTimeout(() => {
                        currentUser = null;
                        hideLoader();
                        renderApp();
                    }, 400);
                }
            });
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebarOpen = !sidebarOpen;
            if (sidebarOpen) {
                sb.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sb.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function switchAdminMenu(menuId) {
            showLoader();
            currentMenu = menuId;
            if (sidebarOpen) toggleSidebar();
            setTimeout(() => {
                renderApp();
                hideLoader();
            }, 300);
        }

        function initMenuContent() {
            const container = document.getElementById('admin-main-content');
            if (!container) return;

            switch(currentMenu) {
                case 'dashboard':
                    container.innerHTML = renderAdminDashboard();
                    initAdminCharts();
                    break;
                case 'settings':
                    container.innerHTML = renderSettingsMenu();
                    break;
                case 'users':
                    container.innerHTML = renderUsersMenu();
                    break;
                case 'students':
                    container.innerHTML = renderStudentsMenu();
                    break;
                case 'assignments':
                    container.innerHTML = renderAssignmentsMenu();
                    break;
                case 'grading':
                    container.innerHTML = renderGradingMenu();
                    break;
                case 'search-student':
                    container.innerHTML = renderSearchStudentMenu();
                    break;
                case 'tracking':
                    container.innerHTML = renderTrackingMenu();
                    break;

        function saveUser(e) {
            e.preventDefault();
            const u = document.getElementById('user-username').value;
            const p = document.getElementById('user-password').value;
            const n = document.getElementById('user-fullname').value;
            const r = document.querySelector('input[name="user-role"]:checked').value;

            db.users.push({ id: Date.now(), username: u, password: p, name: n, role: r });
            closeModal();
            Swal.fire({ icon: 'success', title: 'เพิ่มเรียบร้อย', timer: 1200, showConfirmButton: false });
            switchAdminMenu('users');
        }

        function deleteUser(id) {
            Swal.fire({
                title: 'ยืนยันการลบผู้ใช้?',
                text: 'หากลบแล้วจะไม่สามารถถอยกลับได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#EF5350',
                cancelButtonColor: '#94A3B8',
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: 'ยกเลิก'
            }).then(r => {
                if (r.isConfirmed) {
                    db.users = db.users.filter(x => x.id !== id);
                    Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1000, showConfirmButton: false });
                    switchAdminMenu('users');
                }
            });
        }

        function downloadExcelTemplate(type) {
            const data = type === 'users' ? [
                { Username: '65005', Password: 'passwordsample', Name: 'นายทดสอบ ระบบ', Role: 'student' }
            ] : [
                { StudentID: '65005', Name: 'นายทดสอบ ระบบ', ClassLevel: 'ม.4', Room: '4/1', ColorHex: '#0C7C82' }
            ];
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, `${type}_template.xlsx`);
        }

        function exportUsersExcel() {
            const data = db.users.map(u => ({ Username: u.username, Name: u.name, Role: u.role }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Users");
            XLSX.writeFile(wb, "users_export.xlsx");
        }

        function importUsersExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                jsonData.forEach(item => {
                    if (item.Username && item.Name) {
                        db.users.push({
                            id: Date.now() + Math.random(),
                            username: String(item.Username),
                            password: String(item.Password || '123456'),
                            name: item.Name,
                            role: item.Role || 'student'
                        });
                    }
                });
                Swal.fire({ icon: 'success', title: 'นำเข้าข้อมูลสำเร็จ', text: `นำเข้า ${jsonData.length} รายการแล้ว` });
                switchAdminMenu('users');
            };
            reader.readAsArrayBuffer(file);
        }

        function saveGrade(e, subId) {
            e.preventDefault();
            const sub = db.submissions.find(s => s.id === subId);
            if (sub) {
                sub.status = document.getElementById('grade-status').value;
                sub.score = parseInt(document.getElementById('grade-score').value);
                sub.teacherNote = document.getElementById('grade-note').value;

                if (sub.teacherNote) {
                    db.teacherMessages.push({
                        id: Date.now(),
                        studentId: sub.studentId,
                        message: `[ผลการตรวจงาน] ${sub.teacherNote}`,
                        sender: currentUser.name,
                        date: new Date().toLocaleString('th-TH')
                    });
                }
            }
            closeModal();
            Swal.fire({ icon: 'success', title: 'ตรวจงานสำเร็จ', text: 'บันทึกการตรวจและแจ้งเตือนนักเรียนเรียบร้อย', timer: 1500, showConfirmButton: false });

            openModal(`

                <p class="text-xs text-slate-500 mb-4">ผู้รับ: <b class="text-slate-800">${studentName} (${studentId})</b></p>

                        </button>
                    </div>
                </form>

        function sendMessageToStudent(e, studentId) {
            e.preventDefault();
            const txt = document.getElementById('msg-text').value;
            db.teacherMessages.push({
                id: Date.now(),
                studentId,
                message: txt,
                sender: currentUser.name,
                date: new Date().toLocaleString('th-TH')
            });
            closeModal();
            Swal.fire({ icon: 'success', title: 'ส่งข้อความเรียบร้อย', text: 'ข้อความแจ้งเตือนถูกส่งไปยังเมนูนักเรียนแล้ว', timer: 1500, showConfirmButton: false });

        function switchStudentMenu(menuId) {
            showLoader();
            currentMenu = menuId;
            if (sidebarOpen) toggleSidebar();
            setTimeout(() => {
                renderApp();
                hideLoader();
            }, 300);
        }

        function initStudentMenuContent() {
            const container = document.getElementById('student-main-content');
            if (!container) return;

            switch(currentMenu) {
                case 'std-dashboard':
                    container.innerHTML = renderStudentDashboard();
                    initStudentCharts();
                    break;
                case 'std-assigned':
                    container.innerHTML = renderStudentAssignedMenu();
                    break;
                case 'std-submit':
                    container.innerHTML = renderStudentSubmitMenu();
                    break;
                case 'std-submitted':
                    container.innerHTML = renderStudentSubmittedMenu();
                    initStudentSubmittedChart();
                    break;
                case 'std-pending':
                    container.innerHTML = renderStudentPendingMenu();
                    break;
                case 'std-messages':
                    container.innerHTML = renderStudentMessagesMenu();
                    break;
            }
        }

            </div>
            `;
        }

        function initStudentCharts() {
            const ctx = document.getElementById('stdDashboardChart')?.getContext('2d');
            if (ctx) {
                const mySubmissions = db.submissions.filter(s => s.studentId === currentUser.username);
                const submittedCount = mySubmissions.length;
                const pendingCount = db.assignments.length - submittedCount;

                new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['ส่งงานแล้ว', 'ยังไม่ได้ส่ง'],
                        datasets: [{
                            data: [submittedCount, pendingCount],
                            backgroundColor: ['#AED581', '#EF5350']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        /* --------------------------------------------------------------------------
           Student Menu 2: Assigned Tasks
           -------------------------------------------------------------------------- */
        function renderStudentAssignedMenu() {
            return `
            <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm">
                <div class="p-4 border-b border-slate-100 font-bold text-slate-800">
                    รายการงานที่ครูมอบหมายทั้งหมด
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b border-slate-100 text-xs text-slate-500 uppercase">
                            <tr>
                                <th class="p-3">รายวิชา</th>
                                <th class="p-3">ชื่องาน</th>
                                <th class="p-3">วันที่มอบหมาย</th>
                                <th class="p-3">วันกำหนดส่งงาน</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${db.assignments.map(a => `
                                <tr class="hover:bg-slate-50/50">
                                    <td class="p-3 font-semibold text-brand-primary">${a.subject}</td>
                                    <td class="p-3 font-medium text-slate-800">${a.title}</td>
                                    <td class="p-3 text-xs text-slate-500">${a.assignedDate || '2026-10-01'}</td>
                                    <td class="p-3 text-xs text-brand-rose font-medium">${a.dueDate}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
        }

        /* --------------------------------------------------------------------------
           Student Menu 3: Submit Task (ส่งงาน)
           -------------------------------------------------------------------------- */
        function renderStudentSubmitMenu() {
            const mySubmissions = db.submissions.filter(s => s.studentId === currentUser.username);

            return `
            <div class="max-w-2xl mx-auto space-y-6">
                <!-- Notifications from Teacher if graded -->
                ${mySubmissions.filter(s => s.teacherNote).map(s => {
                    const asg = db.assignments.find(a => a.id === s.assignmentId) || {};
                    return `
                    <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex items-start gap-3 text-amber-900">
                        <i class="fa-solid fa-circle-info text-amber-600 text-lg mt-0.5"></i>
                        <div>
                            <h4 class="font-bold text-xs">แจ้งเตือนการตรวจงานจากครู: ${asg.title}</h4>
                            <p class="text-xs mt-1">${s.teacherNote}</p>
                            <span class="text-[10px] text-amber-600 font-semibold mt-1 inline-block">สถานะ: ${s.status}</span>
                        </div>
                    </div>
                    `;
                }).join('')}

                <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-cloud-arrow-up text-brand-teal mr-2"></i>ฟอร์มส่งงานนักเรียน
                    </h3>

                    <form onsubmit="handleStudentSubmission(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">เลือกรายวิชา</label>
                            <select id="sub-subject" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none" onchange="filterAssignmentsBySubject(this.value)">
                                <option value="">-- กรุณาเลือกรายวิชา --</option>
                                ${db.systemSettings.subjects.map(s => `<option value="${s}">${s}</option>`).join('')}
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">เลือกงานที่ต้องการส่ง</label>
                            <select id="sub-assignment" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none" required>
                                ${db.assignments.map(a => `<option value="${a.id}">${a.title} (${a.subject})</option>`).join('')}
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Dropdown ประเภทการส่ง</label>
                                <select id="sub-type" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none" onchange="toggleUploadInputs(this.value)">
                                    <option value="file">อัปโหลดไฟล์ (.png, .jpg, .pdf)</option>
                                    <option value="link">แนบลิงก์ (URL)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">ตั้งค่าสี Color Picker</label>
                                <input type="color" id="sub-color" value="#35B4B0" class="h-10 w-full cursor-pointer rounded-xl border border-slate-200 p-1">
                            </div>
                        </div>

                        <div id="input-file-container">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">อัพโหลดงาน (ไฟล์ .png, .jpg, .pdf)</label>
                            <input type="file" id="sub-file" accept=".png, .jpg, .jpeg, .pdf" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-medium file:bg-brand-primary file:text-white">
                        </div>

                        <div id="input-link-container" class="hidden">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">แนบลิงก์งาน (Link Google Drive / Canva)</label>
                            <input type="url" id="sub-link" placeholder="https://..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm outline-none">
                        </div>

                        <button type="submit" class="w-full bg-brand-primary hover:bg-brand-teal text-white py-3 rounded-xl font-medium shadow-md shadow-brand-primary/20 transition">
                            <i class="fa-solid fa-paper-plane mr-1"></i> ยืนยันการส่งงาน
                        </button>
                    </form>
                </div>
            </div>
            `;
        }

        function toggleUploadInputs(val) {
            if (val === 'file') {
                document.getElementById('input-file-container').classList.remove('hidden');
                document.getElementById('input-link-container').classList.add('hidden');
            } else {
                document.getElementById('input-file-container').classList.add('hidden');
                document.getElementById('input-link-container').classList.remove('hidden');
            }
        }

        function handleStudentSubmission(e) {
            e.preventDefault();
            showLoader();
            const asgId = parseInt(document.getElementById('sub-assignment').value);
            const fileType = document.getElementById('sub-type').value;
            let fileName = 'my_work_doc.pdf';

            if (fileType === 'link') {
                fileName = document.getElementById('sub-link').value || 'https://link.com';
            } else {
                const f = document.getElementById('sub-file').files[0];
                if (f) fileName = f.name;
            }

            setTimeout(() => {
                db.submissions.push({
                    id: Date.now(),
                    assignmentId: asgId,
                    studentId: currentUser.username,
                    fileType,
                    fileName,
                    submittedAt: new Date().toLocaleString('th-TH'),
                    status: 'ยังไม่ตรวจ',
                    score: 0,
                    teacherNote: '',
                    color: document.getElementById('sub-color').value
                });
                hideLoader();
                Swal.fire({ icon: 'success', title: 'ส่งงานเรียบร้อยแล้ว', timer: 1500, showConfirmButton: false });
                switchStudentMenu('std-submitted');
            }, 500);
        }

        /* --------------------------------------------------------------------------
           Student Menu 4: Submitted Tasks (งานที่ส่งแล้ว + สถิติกราฟ)
           -------------------------------------------------------------------------- */
        function renderStudentSubmittedMenu() {
            const mySubmissions = db.submissions.filter(s => s.studentId === currentUser.username);

            return `
            <div class="space-y-6">
                <!-- สถิติกราฟส่งงาน -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <h4 class="font-bold text-slate-800 text-sm mb-2">แสดงสถิติกราฟส่งงาน</h4>
                    <div class="relative w-full h-48 flex items-center justify-center">
                        <canvas id="studentSubmittedChart"></canvas>
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm">
                    <div class="p-4 border-b border-slate-100 font-bold text-slate-800">รายการงานที่ส่งแล้ว</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 border-b border-slate-100 text-xs text-slate-500 uppercase">
                                <tr>
                                    <th class="p-3">รายวิชา</th>
                                    <th class="p-3">งานที่ส่งแล้ว</th>
                                    <th class="p-3">วันที่ส่ง</th>
                                    <th class="p-3">สถานะ</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${mySubmissions.map(s => {
                                    const asg = db.assignments.find(a => a.id === s.assignmentId) || {};
                                    return `
                                    <tr class="hover:bg-slate-50/50">
                                        <td class="p-3 font-semibold text-brand-primary">${asg.subject || '-'}</td>
                                        <td class="p-3 font-medium text-slate-800">${asg.title || '-'}</td>
                                        <td class="p-3 text-xs text-slate-500">${s.submittedAt}</td>
                                        <td class="p-3">
                                            <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-800">
                                                ${s.status}
                                            </span>
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }

        function initStudentSubmittedChart() {
            const ctx = document.getElementById('studentSubmittedChart')?.getContext('2d');
            if (ctx) {
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['งานที่ส่งแล้วทั้งหมด'],
                        datasets: [{
                            label: 'จำนวนงานที่ส่ง (ชิ้น)',
                            data: [db.submissions.filter(s => s.studentId === currentUser.username).length],
                            backgroundColor: ['#35B4B0']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        /* --------------------------------------------------------------------------
           Student Menu 5: Pending Tasks (งานที่ยังไม่ส่ง)
           -------------------------------------------------------------------------- */
        function renderStudentPendingMenu() {
            const mySubmittedIds = db.submissions.filter(s => s.studentId === currentUser.username).map(s => s.assignmentId);
            const pendingAssignments = db.assignments.filter(a => !mySubmittedIds.includes(a.id));

            return `
            <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm">
                <div class="p-4 border-b border-slate-100 font-bold text-slate-800 flex justify-between items-center">
                    <span>รายการงานที่ยังไม่ได้ส่ง</span>
                    <span class="text-xs text-brand-rose bg-rose-50 px-2.5 py-1 rounded-full">ค้างส่ง ${pendingAssignments.length} งาน</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b border-slate-100 text-xs text-slate-500 uppercase">
                            <tr>
                                <th class="p-3">รายวิชา</th>
                                <th class="p-3">ประเภทงาน</th>
                                <th class="p-3">ชื่องาน</th>
                                <th class="p-3">งานที่ยังไม่ส่ง</th>
                                <th class="p-3">วันกำหนดส่ง (ข้อความสีแดง)</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${pendingAssignments.map(a => `
                                <tr class="hover:bg-slate-50/50">
                                    <td class="p-3 font-semibold text-brand-primary">${a.subject}</td>
                                    <td class="p-3 text-xs">${a.type}</td>
                                    <td class="p-3 font-medium text-slate-800">${a.title}</td>
                                    <td class="p-3">
                                        <span class="bg-rose-100 text-rose-700 text-xs font-semibold px-2.5 py-1 rounded-full">ยังไม่ได้ส่ง</span>
                                    </td>
                                    <td class="p-3 text-xs text-red-600 font-bold">${a.dueDate}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
            `;
        }

        /* --------------------------------------------------------------------------
           Student Menu 6: Teacher Messages (ข้อความจากครู)
           -------------------------------------------------------------------------- */
        function renderStudentMessagesMenu() {
            const msgs = db.teacherMessages.filter(m => m.studentId === currentUser.username);

            return `
            <div class="max-w-3xl mx-auto space-y-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200/80 font-bold text-slate-800">
                    <i class="fa-solid fa-envelope-open-text text-brand-primary mr-2"></i>ข้อความที่ครูพิมพ์แจ้งมาในระบบ
                </div>

                ${msgs.length === 0 ? `
                    <div class="bg-white p-8 text-center rounded-2xl border border-slate-200/80 text-slate-400">
                        <i class="fa-solid fa-inbox text-3xl mb-2"></i>
                        <p class="text-xs">ไม่มีข้อความแจ้งเตือนใหม่จากครู</p>
                    </div>
                ` : msgs.map(m => `
                    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-2">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                            <span class="font-bold text-xs text-brand-primary"><i class="fa-solid fa-user-tie mr-1"></i> ${m.sender}</span>
                            <span class="text-[10px] text-slate-400">${m.date}</span>
                        </div>
                        <p class="text-sm text-slate-700 leading-relaxed">${m.message}</p>
                    </div>
                `).join('')}
            </div>
            `;
        }

        /* Global Helpers & Modals */
        function openModal(htmlContent) {
            document.getElementById('modal-body').innerHTML = htmlContent;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        function quickPhoneShortcut() {
            Swal.fire({
                title: 'iPhone Style Shortcut',
                text: 'เมนูทางลัดด่วนบนมือถือ',
                icon: 'info',
                confirmButtonColor: '#0C7C82'
            });
        }
    </script>
</body>
</html>
